[pytest]
# 测试目录
testpaths = tests

# 测试文件匹配规则
python_files = test_*.py *_test.py

# 测试类匹配规则
python_classes = Test*

# 测试函数匹配规则
python_functions = test_*

# 日志级别
log_level = INFO

# 测试结果显示格式
verbosity = 2

# 启用颜色输出
color = yes

# 禁用警告
addopts = -W ignore::DeprecationWarning -W ignore::FutureWarning

# 测试覆盖率配置
# cov-report = term-missing
# cov = scpi_app
